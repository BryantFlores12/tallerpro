<script>
/* ================= CONFIG API ================= */
const API_BASE = window.location.protocol.startsWith('http') ? window.location.origin + '/api' : 'http://localhost:4000/api';
let TOKEN = sessionStorage.getItem('tp_token') || null;

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, { method: options.method || 'GET', headers, body: options.body ? JSON.stringify(options.body) : undefined });
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { clearSess(); renderLogin(); throw new Error('Sesión expirada, inicie sesión de nuevo'); }
  if (!res.ok || data.ok === false) throw new Error(data.message || 'Error en la solicitud');
  return data.data;
}

async function refreshData(){
  const rol=S.user.rol;
  const reqs={clientes:api('/clientes'),vehiculos:api('/vehiculos'),ordenes:api('/ordenes'),bitacora:api('/bitacora'),inventario:api('/inventario'),tareas:api('/tareas')};
  if(rol!=='mecanico'){reqs.cotizaciones=api('/cotizaciones');reqs.trazabilidad=api('/inventario/trazabilidad');}
  const keys=Object.keys(reqs);const vals=await Promise.all(keys.map(k=>reqs[k]));const d={};keys.forEach((k,i)=>d[k]=vals[i]);
  DB.clients=d.clientes.map(mapCliente);DB.vehicles=d.vehiculos.map(mapVehiculo);DB.orders=d.ordenes.map(mapOrden);
  DB.diag=d.bitacora.map(mapDiag);DB.inv=d.inventario.map(mapInv);DB.tasks=d.tareas.map(mapTarea);
  DB.quotes=(d.cotizaciones||[]).map(mapCot);DB.traz=(d.trazabilidad||[]).map(mapTraz);
}

 '<div class="card card-pad" style="background:#f8fafc;margin-bottom:12px"><b>'+vehName(v)+'</b><div class="muted small">'+esc(cli(v.clienteId).nombre)+' · '+esc(v.placa||'')+'</div>'+((ord(t.ordenId))?'<div class="small" style="margin-top:8px"><b>Motivo:</b> '+esc(ord(t.ordenId).motivo||'')+'</div>':'')+'</div>'+
 '<div class="frm-grid"><div><label class="fl">Refacción</label><select class="sel" onchange="updRef(\''+id+'\',this.value)">'+['Sin solicitud','Solicitada','En tránsito','Entregada al técnico'].map(r=>'<option '+(t.refEst===r?'selected':'')+'>'+r+'</option>').join('')+'</select></div><div><label class="fl">Avance: <b id="avLbl">'+(t.avance||0)+'%</b></label><input type="range" min="0" max="100" value="'+(t.avance||0)+'" oninput="avLbl(this.value)" onchange="updAv(\''+id+'\',this.value)"></div></div>'+
 '<div class="m-foot"><button class="btn btn-o" onclick="mClose();openReqPart(\''+id+'\')">'+I.box+' Solicitar pieza</button><button class="btn btn-o" onclick="mClose();nav(\'bitacora\',{vid:\''+v.id+'\'})">'+I.act+' Bitácora</button><button class="btn btn-p" onclick="mClose()">Listo</button></div>','md','Tarea · '+ordFolio(t.ordenId))}
async function updRef(id,v){try{await api('/tareas/'+id,{method:'PATCH',body:{refaccion_estado:v}});await refreshData();toast('Estatus: '+v);navigate('tablero');}catch(e){toast(e.message,'err');}}
function avLbl(v){$('#avLbl').textContent=v+'%'}
async function updAv(id,v){try{await api('/tareas/'+id,{method:'PATCH',body:{avance:parseInt(v)}});await refreshData();}catch(e){toast(e.message,'err');}}
function openReqPart(id){mOpen('<input class="in" style="margin-bottom:10px" placeholder="Buscar…" oninput="rpFilter(this.value,\''+id+'\')"><div id="rpList">'+rpListHtml('',id)+'</div>','md','Solicitar pieza')}
function rpListHtml(q,id){q=(q||'').toLowerCase();return DB.inv.filter(p=>(p.nombre+p.sku).toLowerCase().includes(q)).map(p=>'<div class="rowline" style="padding:9px 4px;border-bottom:1px solid #f1f4f8"><div style="flex:1"><b style="font-size:13px">'+esc(p.nombre)+'</b><div class="muted tiny">Stock: '+p.stock+'</div></div><button class="btn btn-p btn-sm" onclick="reqPart(\''+id+'\',\''+p.id+'\')">Solicitar</button></div>').join('')}
function rpFilter(q,id){$('#rpList').innerHTML=rpListHtml(q,id)}
async function reqPart(tid,pid){try{await api('/tareas/'+tid,{method:'PATCH',body:{refaccion_estado:'Solicitada'}});await refreshData();mClose();toast('Solicitud enviada a almacén');navigate('tablero');}catch(e){toast(e.message,'err');}}

VIEWS.sistema=function(){const M=[['Recepción y CRM',1,1,0],['Bitácora técnica',1,1,1],['Inventario',1,1,1],['Cotizaciones y cobros',1,1,0],['Panel de mecánicos',1,1,1],['Métricas financieras',1,0,0]];
 return '<div class="vhead"><div><h1>Sistema, seguridad y arquitectura</h1><p>Configuración y controles de integridad.</p></div></div><div class="sec-grid">'+
 '<div class="card card-pad"><div class="sec-t" style="margin-top:0">'+I.users+' Usuarios y RBAC</div><table class="tbl"><thead><tr><th>Usuario</th><th>Rol</th></tr></thead><tbody>'+USERS.map(u=>'<tr><td><div class="rowline">'+avat(u,30)+'<div><b>'+u.nombre+'</b><div class="muted tiny">'+u.puesto+'</div></div></div></td><td><span class="badge '+rolBadge(u.rol)+'">'+ROL_LBL[u.rol]+'</span></td></tr>').join('')+'</tbody></table>'+
 '<div class="sec-t">Matriz de permisos</div><table class="tbl perm-t"><thead><tr><th>Módulo</th><th>Admin</th><th>Recep.</th><th>Mecán.</th></tr></thead><tbody>'+M.map(r=>'<tr><td>'+r[0]+'</td>'+[1,2,3].map(i=>'<td class="'+(r[i]?'yes':'no')+'">'+(r[i]?'✓':'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
 '<div class="card card-pad"><div class="sec-t" style="margin-top:0">'+I.shield+' Seguridad</div><div class="chips"><span class="chip grn">'+I.lock+' HTTPS / TLS 1.3</span><span class="chip grn">'+I.lock+' bcrypt (costo 12)</span><span class="chip grn">'+I.shield+' Consultas parametrizadas</span><span class="chip grn">'+I.shield+' Sanitización XSS</span><span class="chip grn">'+I.lock+' JWT con expiración</span><span class="chip grn">'+I.clock+' Respaldo 24 h</span></div>'+
 '<div class="sec-t">'+I.db+' Integridad referencial</div><table class="med-tbl"><tr><td>clientes</td><td>1 ─ N</td><td>vehiculos</td></tr><tr><td>vehiculos</td><td>1 ─ N</td><td>ordenes</td></tr><tr><td>ordenes</td><td>1 ─ N</td><td>bitacora</td></tr><tr><td>inventario</td><td>1 ─ N</td><td>trazabilidad</td></tr><tr><td>cotizaciones</td><td>1 ─ N</td><td>pagos</td></tr></table></div>'+
 '<div class="card card-pad"><div class="sec-t" style="margin-top:0">'+I.zap+' Rendimiento</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="stat-pill"><b>99.95%</b><span class="muted small">disponibilidad</span></div><div class="stat-pill"><b>120 ms</b><span class="muted small">respuesta</span></div><div class="stat-pill"><b>250+</b><span class="muted small">concurrentes</span></div></div></div>'+
 '<div class="card card-pad"><div class="sec-t" style="margin-top:0">'+I.card+' Métricas financieras (solo admin)</div><p class="muted small">Ocultas automáticamente para recepción y mecánicos.</p></div></div>';};

/* ---------- ORDEN DE INGRESO ---------- */
function openNewClient(){mOpen('<div class="frm-grid"><div class="full"><label class="fl">Nombre / Razón social *</label><input class="in" id="ncNombre"></div><div><label class="fl">Teléfono</label><input class="in" id="ncTel"></div><div><label class="fl">Correo</label><input class="in" id="ncMail"></div><div><label class="fl">RFC</label><input class="in" id="ncRfc"></div><div><label class="fl">Dirección</label><input class="in" id="ncDir"></div><div class="full"><label class="fl">Notas</label><textarea class="ta" id="ncNotas"></textarea></div></div><div class="m-foot"><button class="btn btn-o" onclick="mClose()">Cancelar</button><button class="btn btn-p" onclick="saveClient()">Guardar</button></div>','md','Nuevo cliente')}
async function saveClient(){const nombre=$('#ncNombre').value.trim();if(!nombre){toast('El nombre es obligatorio','warn');return}try{await api('/clientes',{method:'POST',body:{nombre,telefono:$('#ncTel').value,email:$('#ncMail').value,rfc:$('#ncRfc').value,direccion:$('#ncDir').value,notas:$('#ncNotas').value}});await refreshData();mClose();toast('Cliente registrado');nav('crm');}catch(e){toast(e.message,'err');}}
function openNewVeh(cid){mOpen('<div class="frm-grid"><div><label class="fl">Marca *</label><input class="in" id="nvMarca"></div><div><label class="fl">Modelo *</label><input class="in" id="nvModelo"></div><div><label class="fl">Año</label><input class="in" type="number" id="nvAnio"></div><div><label class="fl">Kilometraje</label><input class="in" type="number" id="nvKm"></div><div class="full"><label class="fl">VIN</label><input class="in" id="nvVin"></div><div><label class="fl">Placa</label><input class="in" id="nvPlaca"></div><div><label class="fl">Color</label><input class="in" id="nvColor"></div></div><div class="m-foot"><button class="btn btn-o" onclick="mClose()">Cancelar</button><button class="btn btn-p" onclick="saveVeh(\''+cid+'\')">Guardar</button></div>','md','Alta de vehículo')}
async function saveVeh(cid){const marca=$('#nvMarca').value.trim(),modelo=$('#nvModelo').value.trim();if(!marca||!modelo){toast('Marca y modelo son obligatorios','warn');return}try{await api('/vehiculos',{method:'POST',body:{cliente_id:cid,marca,modelo,anio:parseInt($('#nvAnio').value)||null,vin:$('#nvVin').value,placa:$('#nvPlaca').value,kilometraje:parseInt($('#nvKm').value)||0,color:$('#nvColor').value}});await refreshData();mClose();toast('Vehículo dado de alta');nav('crm',{cid});}catch(e){toast(e.message,'err');}}
function openIntake(cid,vid){if(!cid){toast('Primero registre un cliente','warn');return}const vs=DB.vehicles.filter(v=>v.clienteId===cid);_INT={cid,vehiculoId:vid||(vs[0]?vs[0].id:null),zonas:new Set(),valores:new Set(),firma:null,modo:'firma'};_SIGINK=false;mOpen(intakeHtml(cli(cid),vs),'lg','Orden de ingreso digital · '+esc(cli(cid).nombre));initSig()}
function intakeHtml(c,vs){return '<div class="frm-grid"><div><label class="fl">Vehículo *</label><select class="sel" id="inVeh">'+vs.map(v=>'<option value="'+v.id+'" '+(_INT.vehiculoId===v.id?'selected':'')+'>'+vehName(v)+' · '+esc(v.placa||'')+'</option>').join('')+'</select></div><div><label class="fl">Kilometraje</label><input class="in" type="number" id="inKm" value="'+(veh(_INT.vehiculoId).kilometraje||'')+'"></div><div><label class="fl">Asesor</label><input class="in" value="'+esc(S.user.nombre)+'" id="inAsesor"></div><div><label class="fl">Técnico</label><select class="sel" id="inTec">'+USERS.filter(u=>u.rol==='mecanico').map(u=>'<option value="'+u.id+'">'+u.nombre+'</option>').join('')+'</select></div><div class="full"><label class="fl">Motivo</label><textarea class="ta" id="inMotivo"></textarea></div></div>'+
 '<div class="sec-t">'+I.zap+' Nivel de gasolina</div><div style="max-width:420px"><div class="fuel-bar"><div class="fuel-pin" id="fuelPin" style="left:50%"></div></div><div class="fuel-lbls"><span>E</span><span>1/4</span><span>1/2</span><span>3/4</span><span>F</span></div><input type="range" min="0" max="100" value="50" oninput="fuelUpd(this.value)"><b id="fuelTxt" style="font-size:13px">50% del tanque</b></div>'+
 '<div class="sec-t">'+I.cam+' Estado exterior (toque zonas con daño)</div><div class="carwrap"><div id="carHost">'+carSvg()+'</div><div style="flex:1;min-width:200px"><div class="chips" id="zonaChips"></div></div></div>'+
 '<div class="sec-t">'+I.box+' Objetos de valor</div><div class="chips" style="margin-top:0">'+['Estéreo','Herramienta','Gato y llanta','Documentos','Electrónica'].map(v=>'<button class="chip" onclick="valToggle(this,\''+v+'\')">'+v+'</button>').join('')+'</div>'+
 '<div class="sec-t">'+I.file+' Observaciones</div><textarea class="ta" id="inObs"></textarea>'+
 '<div class="sec-t">'+I.lock+' Aprobación del cliente</div><div class="rowline" style="flex-wrap:wrap"><label class="rowline" style="gap:6px"><input type="radio" name="inModo" value="firma" checked onchange="modoFirma(\'firma\')"> Firma en recepción</label><label class="rowline" style="gap:6px"><input type="radio" name="inModo" value="enlace" onchange="modoFirma(\'enlace\')"> Enlace web</label></div>'+
 '<div id="sigWrap" style="margin-top:10px"><div class="sig-box"><canvas id="sigPad"></canvas><span class="sig-hint" id="sigHint">El cliente firma aquí</span></div><div class="rowline" style="margin-top:8px"><button class="btn btn-o btn-sm" onclick="sigClear()">'+I.trash+' Limpiar</button></div></div>'+
 '<div id="linkWrap" class="hidden" style="margin-top:10px"><div class="card card-pad" style="background:#f8fafc"><p class="tiny muted">Se generará un enlace único de aprobación.</p></div></div>'+
 '<div class="m-foot"><button class="btn btn-o" onclick="mClose()">Cancelar</button><button class="btn btn-p" onclick="submitOrder()">'+I.check+' Registrar orden</button></div>'}
function carSvg(){let s='<svg class="car-svg" viewBox="0 0 200 380"><rect x="52" y="14" width="96" height="352" rx="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><rect x="62" y="118" width="76" height="120" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect x="66" y="126" width="68" height="26" rx="8" fill="#cbd5e1"/><rect x="66" y="204" width="68" height="22" rx="8" fill="#cbd5e1"/><rect x="38" y="60" width="14" height="46" rx="7" fill="#94a3b8"/><rect x="148" y="60" width="14" height="46" rx="7" fill="#94a3b8"/><rect x="38" y="268" width="14" height="46" rx="7" fill="#94a3b8"/><rect x="148" y="268" width="14" height="46" rx="7" fill="#94a3b8"/>';
 ZONAS.forEach(z=>{const sel=_INT.zonas.has(z.id);s+='<circle class="zona" cx="'+z.x+'" cy="'+z.y+'" r="17" onclick="toggleZona(\''+z.id+'\')"/>'+(sel?'<circle class="zmark" cx="'+z.x+'" cy="'+z.y+'" r="7"/>':'')});return s+'</svg>'}
function toggleZona(id){_INT.zonas.has(id)?_INT.zonas.delete(id):_INT.zonas.add(id);$('#carHost').innerHTML=carSvg();$('#zonaChips').innerHTML=[..._INT.zonas].map(z=>'<span class="chip red">'+esc(z)+'</span>').join('')}
function valToggle(el,v){if(_INT.valores.has(v)){_INT.valores.delete(v);el.style.background='';el.style.color='';el.style.borderColor=''}else{_INT.valores.add(v);el.style.background='#e7f8f0';el.style.color='#067647';el.style.borderColor='#bfe9d4'}}
function fuelUpd(v){$('#fuelPin').style.left=v+'%';$('#fuelTxt').textContent=v+'% del tanque'}
function modoFirma(m){_INT.modo=m;$('#sigWrap').classList.toggle('hidden',m!=='firma');$('#linkWrap').classList.toggle('hidden',m!=='enlace')}
function initSig(){const cv=$('#sigPad');if(!cv)return;const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.strokeStyle='#101828';let d=false,l=null;const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};cv.addEventListener('pointerdown',e=>{d=true;l=pos(e);_SIGINK=true;$('#sigHint').style.display='none';cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!d)return;const p=pos(e);ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(p.x,p.y);ctx.stroke();l=p});cv.addEventListener('pointerup',()=>d=false)}
function sigClear(){const cv=$('#sigPad');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);_SIGINK=false;_INT.firma=null;$('#sigHint').style.display='grid'}
async function submitOrder(){if(!_INT.vehiculoId){toast('Seleccione un vehículo','warn');return}const motivo=$('#inMotivo').value.trim();if(!motivo){toast('Indique el motivo','warn');return}if(_INT.modo==='firma'&&!_SIGINK){toast('Capture la firma o cambie a enlace','warn');return}if(_INT.modo==='firma')_INT.firma=$('#sigPad').toDataURL();
 try{const r=await api('/ordenes',{method:'POST',body:{cliente_id:_INT.cid,vehiculo_id:_INT.vehiculoId,tecnico_id:$('#inTec').value,motivo,km:parseInt($('#inKm').value)||0,gasolina:parseInt($('#fuelPin').style.left)||50,zonas:[..._INT.zonas],valores:[..._INT.valores],obs:$('#inObs').value,firma_data:_INT.firma,modo:_INT.modo}});
 await refreshData();mClose();toast('Orden '+r.folio+' registrada');
 mOpen('<div style="text-align:center;padding:8px 0"><h3 style="margin:12px 0 4px">Orden '+r.folio+' creada</h3>'+(_INT.firma?'<img src="'+_INT.firma+'" style="max-width:260px;border:1px solid var(--line);border-radius:10px;margin-top:10px">':'<div class="card card-pad" style="background:#f8fafc;margin-top:12px"><span class="mono tiny">'+r.link+'</span></div>')+'<div class="m-foot" style="border:none;background:none;justify-content:center"><button class="btn btn-o" onclick="copyTxt(\''+r.link+'\')">'+I.link+' Copiar enlace</button><button class="btn btn-p" onclick="mClose();nav(\'crm\',{cid:\''+_INT.cid+'\'})">Ver ficha</button></div></div>','md','Ingreso completado');}catch(e){toast(e.message,'err');}}
function openOrder(id){const o=ord(id);if(!o)return;const v=veh(o.vehiculoId);mOpen('<div class="rowline" style="margin-bottom:12px"><span class="badge '+estBadge(o.estado)+'">'+o.estado+'</span><span class="muted small">'+ftime(o.fecha)+' · Técnico: '+esc(o.tec||'')+'</span></div>'+
 '<div class="card card-pad" style="background:#f8fafc;margin-bottom:12px"><b>'+vehName(v)+'</b><div class="muted small">'+esc(cli(o.clienteId).nombre)+' · '+esc(v.placa||'')+'</div><div class="small" style="margin-top:8px"><b>Motivo:</b> '+esc(o.motivo)+'</div></div>'+
 '<div class="frm-grid" style="gap:10px"><div class="card card-pad"><span class="tiny muted" style="font-weight:700">GASOLINA</span><div class="fuel-bar" style="margin-top:8px"><div class="fuel-pin" style="left:'+o.gasolina+'%"></div></div><b style="font-size:13px">'+o.gasolina+'%</b></div>'+
 '<div class="card card-pad"><span class="tiny muted" style="font-weight:700">ESTADO EXTERIOR</span><div class="chips">'+(o.zonas.length?o.zonas.map(z=>'<span class="chip red">'+esc(z)+'</span>').join(''):'<span class="chip grn">Sin marcas</span>')+'</div></div></div>'+
 '<div class="m-foot"><button class="btn btn-o" onclick="mClose()">Cerrar</button><button class="btn btn-p" onclick="mClose();nav(\'bitacora\',{vid:\''+v.id+'\'})">'+I.act+' Expediente técnico</button></div>','lg','Orden '+o.folio)}

/* ---------- CHARTS / AFTER RENDER ---------- */
function afterRender(v){if(v==='dashboard'&&window.Chart){Chart.defaults.font.family='Inter';Chart.defaults.color='#667085';
 if(S.user.rol==='mecanico'){const mine=DB.tasks.filter(t=>t.tec===S.user.id);mkChart('chMe',{type:'bar',data:{labels:KCOLS.map(k=>k.lbl),datasets:[{data:KCOLS.map(k=>mine.filter(t=>t.estado===k.id).length),backgroundColor:KCOLS.map(k=>k.c),borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});}
 else{mkChart('ch1',{type:'doughnut',data:{labels:['Activa','En espera','Entregado','Cerrada'],datasets:[{data:['Activa','En espera','Entregado','Cerrada'].map(e=>DB.orders.filter(o=>o.estado===e).length),backgroundColor:['#2e90fa','#f79009','#12b76a','#cbd5e1'],borderWidth:3,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom'}}}});
 mkChart('ch3',{type:'doughnut',data:{labels:KCOLS.map(k=>k.lbl),datasets:[{data:KCOLS.map(k=>DB.tasks.filter(t=>t.estado===k.id).length),backgroundColor:KCOLS.map(k=>k.c),borderWidth:3,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom'}}}});}}
 document.querySelectorAll('[data-cid]').forEach(btn=>{btn.onclick=function(){nav('crm',{cid:this.dataset.cid})}});}
function mkChart(id,cfg){const el=document.getElementById(id);if(!el||!window.Chart)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(el,cfg)}

/* ================= BOOT (sesión persistente) ================= */
function boot(){const t=sessionStorage.getItem('tp_token');const u=sessionStorage.getItem('tp_user');
 if(t&&u){TOKEN=t;try{S.user=JSON.parse(u);if(!S.user.ini)S.user.ini=ini(S.user.nombre);}catch(e){S.user=null;}}
 if(S.user){refreshData().then(()=>renderShell()).catch(()=>{clearSess();S.user=null;renderLogin();});}
 else renderLogin();}
boot();
</script>
