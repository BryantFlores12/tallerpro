<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprobación de cotización · TallerPro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/sora@latest/latin-700-normal.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/sora@latest/latin-800-normal.min.css">
<style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--ok:#12b76a;--danger:#f04438;--brand:#f97316}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f4f6fa;color:var(--ink);min-height:100vh;padding:24px 16px}
.wrap{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.brand svg{width:34px;height:34px}.brand b{font-family:'Sora';font-size:18px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px -12px rgba(16,24,40,.15)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.folio{font-family:'Sora';font-weight:800;font-size:15px}
.estado{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.estado.Enviada{background:#e8f3ff;color:#175cd3}.estado.Aprobada{background:#e7f8f0;color:#067647}
.estado.Rechazada{background:#feeceb;color:#d92d20}.estado.Borrador{background:#f2f4f7;color:#475467}.estado.Pagada{background:#fff3e8;color:#c2410c}
h1{font-family:'Sora';font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
td,th{padding:9px 6px;border-bottom:1px solid #f1f4f8;text-align:left}
th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td:last-child,th:last-child{text-align:right}
.totals{border-top:2px solid var(--line);padding-top:10px;margin-bottom:16px}
.trow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted)}
.trow.total{font-family:'Sora';font-weight:800;font-size:18px;color:var(--ink);padding-top:8px}
.notas{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:#344054;margin-bottom:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.btn{padding:14px;border-radius:12px;border:none;font-family:'Sora';font-weight:700;font-size:15px;cursor:pointer}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;color:var(--danger);border:2px solid #fdd3cf}
.tiny{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px}
.done{text-align:center;padding:18px 0;font-size:15px}
.errbox{text-align:center;padding:20px 0}.errbox h2{font-family:'Sora';font-size:18px;margin-bottom:8px}.errbox p{color:var(--muted)}
.loading{text-align:center;padding:40px 0;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#f97316"/><g transform="translate(12,12)" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g></svg><b>TallerPro</b></div>
  <div class="card" id="main"><div class="loading"><div class="spin"></div>Cargando su cotización…</div></div>
</div>
<script>
const API = window.location.origin + '/api';
const token = new URLSearchParams(window.location.search).get('token');
const main = document.getElementById('main');
const money = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function errHtml(m){ return `<div class="errbox"><h2>No pudimos cargar la cotización</h2><p>${esc(m)}</p><p class="tiny">Contacte al taller si el problema persiste.</p></div>`; }
function render(q){
  const decidido = ['Aprobada','Rechazada','Pagada'].includes(q.estado);
  main.innerHTML = `
    <div class="head"><span class="folio">${esc(q.folio)}</span><span class="estado ${q.estado}">${q.estado}</span></div>
    <h1>Su cotización está lista</h1>
    <p class="sub">${esc(q.cliente)} · ${esc(q.vehiculo)}</p>
    <table><thead><tr><th>Concepto</th><th>Cant.</th><th>Importe</th></tr></thead><tbody>
      ${q.items.map(it=>`<tr><td>${esc(it.desc)}</td><td>${it.tipo==='pieza'?it.cant+' pza':it.horas+' h'}</td><td>${money(it.tipo==='pieza'?it.costo*(1+it.margen/100)*it.cant:it.horas*it.tarifa)}</td></tr>`).join('')}
    </tbody></table>
    <div class="totals">
      <div class="trow"><span>Subtotal</span><span>${money(q.totals.sub)}</span></div>
      <div class="trow"><span>IVA 16%</span><span>${money(q.totals.iva)}</span></div>
      <div class="trow total"><span>Total</span><span>${money(q.totals.total)}</span></div>
    </div>
    ${q.notas?`<p class="notas">📝 ${esc(q.notas)}</p>`:''}
    ${decidido
      ? `<div class="done">Esta cotización ya fue <b>${q.estado.toLowerCase()}</b>. ¡Gracias!</div>`
      : `<div class="actions">
           <button class="btn ok" onclick="decide('aprobar')">✓ Aprobar trabajos</button>
           <button class="btn no" onclick="decide('rechazar')">✗ Rechazar</button>
         </div>
         <p class="tiny">Al aprobar, el taller recibirá la confirmación y agendará su servicio.</p>`}
  `;
}
async function load(){
  if(!token){ main.innerHTML = errHtml('Falta el código de aprobación en el enlace.'); return; }
  try{
    const res = await fetch(API + '/public/cotizacion/' + encodeURIComponent(token));
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.message || 'Error al cargar.');
    render(data.data);
  }catch(e){ main.innerHTML = errHtml(e.message); }
}
async function decide(d){
  main.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  try{
    const res = await fetch(API + '/public/cotizacion/' + encodeURIComponent(token) + '/decision',
      {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({decision:d})});
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.message || 'Error al procesar.');
    load();
  }catch(e){ main.innerHTML = errHtml(e.message); }
}
load();
</script>
</body>
</html>
