name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Smoke-test health endpoint
        env:
          NODE_ENV: test
          DB_USER: ci
          DB_PASSWORD: ci-only-password
          DB_NAME: tallerpro_ci
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          FRONTEND_URL: http://localhost:4000
        run: |
          npm start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          curl --fail --silent http://localhost:4000/api/health
